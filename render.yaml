# Render Blueprint: static site for the self-learning schedule page.
# Connect it via Render dashboard → New → Blueprint → select this repo.
# Every push to main redeploys; the page fetches data/students.json at runtime.
services:
  - type: web
    name: tumo-learner-schedule
    runtime: static
    branch: main
    # Publish only the public files (not tools/, tests/ or reports).
    # js/config.js gets TEMP_PASSWORD (Render dashboard → Environment) so it never lands in git.
    buildCommand: >-
      rm -rf public && mkdir public && cp -r index.html js data public/ &&
      node -e "require('fs').writeFileSync('public/js/config.js', 'window.SITE_CONFIG = ' + JSON.stringify({ tempPassword: process.env.TEMP_PASSWORD || '' }) + ';\n')"
    staticPublishPath: ./public
    envVars:
      # Shared first-login password of new TUMO accounts (as DEFAULT_TEMP_PASSWORD in tumo-onb-app).
      # Set it in the Render dashboard; empty = the password block is not shown.
      - key: TEMP_PASSWORD
        sync: false
    headers:
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /js/*
        name: Cache-Control
        value: no-cache
