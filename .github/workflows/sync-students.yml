# Pulls the master student spreadsheet, keeps only the public fields and commits
# data/students.json when it changed. The site fetches that file at runtime, and
# Render redeploys on every push to main, so sheet edits go live automatically.
#
# Configure ONE of these in Settings → Secrets and variables → Actions:
#   GOOGLE_SERVICE_ACCOUNT_JSON (secret, recommended) — key of a service account the sheet
#       is shared with (Viewer). Downloads the whole workbook (all schedule tabs) via the Drive API.
#       Optional variable STUDENT_SHEET_FILE_ID overrides the file id below.
#   STUDENT_SHEET_CSV_URL (secret) — a direct download link that works without login
#       (requires "Anyone with the link" sharing). Prefer an .xlsx link, e.g.
#       https://drive.google.com/uc?export=download&id=<file id>, since a CSV export holds a single tab.
name: Sync students from master sheet

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-students
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_URL: ${{ secrets.STUDENT_SHEET_CSV_URL }}
      FILE_ID: ${{ vars.STUDENT_SHEET_FILE_ID || '1qcmLsXYRvu6Pf0ghM17V0dvq3sUuBDqm' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          if [ -z "$SA_JSON" ] && [ -z "$SHEET_URL" ]; then
            echo "::error::Set the GOOGLE_SERVICE_ACCOUNT_JSON or STUDENT_SHEET_CSV_URL secret (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet openpyxl google-auth requests

      # The key signs its own token (like tumo-onb-app), so only the Drive API must be enabled.
      - name: Download master sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            python3 tools/fetch_sheet.py "$FILE_ID" "$RUNNER_TEMP/sheet"
          else
            curl -fsSL "$SHEET_URL" -o "$RUNNER_TEMP/sheet"
          fi

      - name: Build data/students.json
        run: python3 tools/sheet_to_students.py "$RUNNER_TEMP/sheet"

      - name: Commit changes
        run: |
          git add data/students.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync students from master sheet"
          git push
